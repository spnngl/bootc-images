# Lint and build every bootc container image, then push it to
# ghcr.io/spnngl/bootc-images/<name>:<version>, <version> being the
# base image major release (the Containerfile's BASE_VERSION build arg).
# Pull requests only lint and build, they never push.
#
# Only the container image is built here. Disk images stay local
# (scripts/build.sh): they need config.toml, which holds credentials.
name: build

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild
  schedule:
    - cron: "0 7 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

# Every run on main pushes the same tags: cancel the older run so it can't
# overwrite the newer one's images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hadolint:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        containerfile:
          - images/fedora/Containerfile
          - images/almalinux/Containerfile
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.containerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: warning

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          # Code scanning tracks alerts per category: keep it stable per
          # file so fixed findings close.
          category: hadolint-${{ matrix.containerfile }}
        if: always()

  # One job per image and platform, each on a runner of that platform:
  # native builds, no QEMU. The push job below merges them into one
  # manifest list per image.
  build:
    name: build ${{ matrix.image.name }}:${{ matrix.image.version }}${{ matrix.image.suffix }} ${{ matrix.platform.arch }}
    needs: hadolint
    # Podman 5.7 / Buildah 1.42 preinstalled: the Containerfiles use
    # COPY --link (buildah 1.41+). ubuntu-24.04 (ubuntu-latest) only has
    # buildah 1.33.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # fedora-bootc:44.x only got x86-64-v3 images
        # almalinux-bootc:10.x got x86-64-v3 and x86-64-v2 images, BUT docker-ce
        # official repo only got v3 binaries
        #
        # Building almalinux:9.x to get v2 binaries without issues, EOL is 2032.
        #
        # Optional keys, for multi-stage Containerfiles: target, the stage to
        # build (default: the last one), and suffix, appended to the tag.
        # fedora and almalinux: dockerenv is <version>, kubeenv <version>-k3s.
        # The push job reuses this list (YAML anchor).
        image: &images
          - name: fedora
            version: "44"
            target: dockerenv
          - name: fedora
            version: "44"
            target: kubeenv
            suffix: -k3s
          - name: almalinux
            version: "9.8"
            target: dockerenv
          - name: almalinux
            version: "9.8"
            target: kubeenv
            suffix: -k3s
          - name: almalinux
            version: "10.2"
            target: dockerenv
          - name: almalinux
            version: "10.2"
            target: kubeenv
            suffix: -k3s
        # Every image is built for every platform. Keep the push job's
        # ARCHES in sync.
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      # kubeenv's k3s and CRI-O release: the Containerfiles' ARG
      # KUBERNETES_VERSION, keep their default in sync.
      KUBERNETES_VERSION: 1.36.5
      NAME: ${{ matrix.image.name }}
      VERSION: ${{ matrix.image.version }}
      TARGET: ${{ matrix.image.target }}
      ARCH: ${{ matrix.platform.arch }}
      TAG: ghcr.io/spnngl/bootc-images/${{ matrix.image.name }}:${{ matrix.image.version }}${{ matrix.image.suffix }}
      # Same as the push job's: <image>_<arch>.tar. "_" can't appear in a
      # tag suffix, so fedora_44_* doesn't match fedora_44-k3s_*.
      ARCHIVE: ${{ matrix.image.name }}_${{ matrix.image.version }}${{ matrix.image.suffix }}_${{ matrix.platform.arch }}.tar
    steps:
      - uses: actions/checkout@v7

      # Reproducible builds
      # See:https://oneuptime.com/blog/post/2026-03-18-use-podman-reproducible-builds/view
      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      # Same flags as scripts/build.sh: context is images/, and
      # --format=docker because the OCI format drops SHELL. --platform is
      # the runner's own: without QEMU, a runner of another platform fails
      # instead of building the wrong one. The source label links the
      # ghcr.io package to this repository. --target only when the matrix
      # sets one.
      - run: >-
          podman build --format=docker ${TARGET:+--target "${TARGET}"} --platform "linux/${ARCH}" --tag "${TAG}" --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" --build-arg "BASE_VERSION=${VERSION}" --build-arg "KUBERNETES_VERSION=${KUBERNETES_VERSION}" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -f "images/${NAME}/Containerfile" images/
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
      # Hand the image to the push job. docker-archive, not oci-archive:
      # converting to OCI would drop SHELL.
      - if: github.event_name != 'pull_request'
        run: podman save --format docker-archive -o "${RUNNER_TEMP}/${ARCHIVE}" "${TAG}"
      # archive: false uploads the tarball as is, under its file name:
      # zipping several GB is slow, and the push job reads the tarball.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # Merge each image's platforms into one manifest list, then sign, push,
  # attest and check it.
  push:
    name: push ${{ matrix.image.name }}:${{ matrix.image.version }}${{ matrix.image.suffix }}
    needs: build
    # needs: build waits for every build job, and fails if any did. Run
    # anyway, unless cancelled or hadolint failed: each image pushes on its
    # own, and fails below if one of its platforms is missing.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Build provenance attestation: OIDC token for its Sigstore
      # certificate, and storing it on GitHub.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: *images
    env:
      NAME: ${{ matrix.image.name }}
      # The build job's platform list.
      ARCHES: amd64 arm64
      TAG: ghcr.io/spnngl/bootc-images/${{ matrix.image.name }}:${{ matrix.image.version }}${{ matrix.image.suffix }}
      ARCHIVE_PREFIX: ${{ matrix.image.name }}_${{ matrix.image.version }}${{ matrix.image.suffix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARCHIVE_PREFIX }}_*.tar
          path: ${{ runner.temp }}/images
          merge-multiple: true
      # One manifest list named TAG, an image per platform. Adding a
      # missing archive fails: never push a list without every platform.
      # The list points at the archives: the push below reads them.
      - run: |-
          read -r -a arches <<< "${ARCHES}"
          podman manifest create "${TAG}"
          for arch in "${arches[@]}"; do
            podman manifest add "${TAG}" "docker-archive:${RUNNER_TEMP}/images/${ARCHIVE_PREFIX}_${arch}.tar"
          done
      # Install the files hosts get from the image, at the same paths: the
      # push only writes sigstore signatures where registries.d enables them,
      # and the check below reads the key from the path policy.json names.
      - run: |-
          sudo install -D -m 0644 -t /etc/containers/registries.d/ images/fedora/sysroot/etc/containers/registries.d/spnngl-bootc-images.yaml
          sudo install -D -m 0644 -t /usr/share/pki/containers/ images/fedora/sysroot/usr/share/pki/containers/spnngl-bootc-images.pub
      # Only CI signs: local builds (scripts/build.sh) are never pushed.
      # podman, not cosign: cosign 3 stores signatures as a sigstore bundle
      # (OCI referrers), which containers/image (bootc, podman, skopeo) can't
      # read. podman writes the sha256-<digest>.sig attachments it reads, and
      # takes cosign keys. RUNNER_TEMP is emptied at the end of the job.
      # The key has no passphrase: --sign-passphrase-file /dev/null gives an
      # empty one, without it podman prompts for it.
      # manifest push signs the list (what bootc checks) and every image in
      # it (what podman checks), and writes the list's digest for the
      # attestation below.
      # REGISTRY_AUTH_FILE: the attestation step only reads Docker's
      # credential file, not podman's default auth.json (same format).
      - id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |-
          umask 077
          printf '%s\n' "${COSIGN_PRIVATE_KEY}" > "${RUNNER_TEMP}/cosign.key"
          export REGISTRY_AUTH_FILE="${HOME}/.docker/config.json"
          podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"
          podman manifest push --all --sign-by-sigstore-private-key "${RUNNER_TEMP}/cosign.key" --sign-passphrase-file /dev/null --digestfile "${RUNNER_TEMP}/digest" "${TAG}" "docker://${TAG}"
          echo "digest=$(< "${RUNNER_TEMP}/digest")" >> "${GITHUB_OUTPUT}"
      # SLSA build provenance (workflow, commit, run) for the manifest list,
      # pushed next to the image as an OCI referrer. Hosts don't read it
      # (see ARCHITECTURE.md, "Signing"); check it with
      # gh attestation verify oci://<tag> -R <owner>/<repo>.
      # No storage record: it needs an organization-owned repository.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/spnngl/bootc-images/${{ matrix.image.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # Pull every platform back with the policy.json this image ships: fails
      # if the signing key doesn't match the committed public key, which
      # would make hosts refuse every upgrade.
      - run: |-
          read -r -a arches <<< "${ARCHES}"
          for arch in "${arches[@]}"; do
            podman pull --platform "linux/${arch}" --signature-policy "images/${NAME}/sysroot/etc/containers/policy.json" "${TAG}"
          done
