# image-builder blueprint used by scripts/build.sh.
# Copy to config.toml (git-ignored) and put your own SSH public key in it.
# https://osbuild.org/docs/user-guide/blueprint-reference/

[[customizations.user]]
name = "coucou"
key = "ssh-ed25519 AAAA... you@example.com"
groups = ["wheel"]
home = "/var/home/coucou"
shell = "/bin/bash"

# Optional registry pull secret, read by bootc and, through
# images/fedora/usr/lib/tmpfiles.d/container-auth.conf, by root's podman and
# docker. Keep only the registries you log in to: an invalid entry breaks
# pulls from that registry. "auth" is base64 of "user:token":
#   printf '%s' 'user:token' | base64
# Docker Hub must use the "https://index.docker.io/v1/" key, the only one
# docker reads (podman accepts it too).
