# CRI-O, k3s' container runtime (images/k3s/install.sh). Overrides the
# package's 10-crio.conf (crun as default runtime). See crio.conf(5).

[crio.runtime]
# Each container's conmon in its pod's cgroup
# (kubepods.slice/.../crio-conmon-<id>.scope) rather than system.slice,
# the default: it counts against the pod and goes away with it. Pods stay
# out of system.slice, like k3s and CRI-O (kube.slice).
# Deprecated for a runtime's monitor_cgroup, but that one, from a drop-in,
# replaces the package's whole runtime table (runtime_path...): this one
# applies to every runtime. "pod" or a systemd slice, else CRI-O fails.
conmon_cgroup = "pod"

[crio.image]
# Pull with the host's single registry pull secret, the one bootc, podman
# and docker use (fedora/sysroot/usr/lib/tmpfiles.d/container-auth.conf).
# A missing file means anonymous pulls. Pod imagePullSecrets still apply.
global_auth_file = "/etc/ostree/auth.json"

[crio.network]
# CRI-O creates and watches each plugin dir at startup: the default,
# /opt/cni/bin, is read-only on bootc and makes it fail. Cilium installs
# its CNI plugin here (cni.binPath, K3S.md). network_dir stays the default,
# /etc/cni/net.d, Cilium's cni.confPath.
plugin_dirs = ["/var/opt/cni/bin"]

# Needed to use feature-flag PodAndContainerStatsFromCRI and still get metrics...
[crio.stats]
included_pod_metrics = ["cpu", "memory", "network", "disk", "diskIO", "oom"]
# Seconds between background collections; requests read the cache. The
# default, 0, collects on every kubelet request and walks every file of
# every container's rootfs each time, whatever included_pod_metrics says
# (~22s per call, 1 of 2 cores, on an Atom C2338).
collection_period = 60
