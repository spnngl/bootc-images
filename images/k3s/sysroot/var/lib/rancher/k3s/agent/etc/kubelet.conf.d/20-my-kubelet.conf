apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
featureGates:
  HPAScaleToZero: true
failSwapOn: true
maxPods: 256
podPidsLimit: -1
serializeImagePulls: false
maxParallelImagePulls: 10
seccompDefault: true
# Lot of stuff to tweak to enable it
protectKernelDefaults: false
tlsMinVersion: VersionTLS12
healthzBindAddress: 127.0.0.1
healthzPort: 10248
readOnlyPort: 0
cgroupsPerQOS: true
cgroupRoot: /
# Run only on cgroupv2
failCgroupV1: true
