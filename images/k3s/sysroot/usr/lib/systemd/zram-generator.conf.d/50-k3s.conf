# Swap on zram, compressed RAM. Without swap, the kernel can only reclaim
# file pages: under memory pressure it drops the daemons' own code and
# reads it back from disk on the next fault. With zram, cold anonymous
# memory is compressed instead.
#
# A drop-in, read after the package's zram-generator.conf if there is one.
# AlmaLinux 9's sets the size with deprecated keys, which win over
# zram-size and give the same size.
[zram0]
zram-size = min(ram, 8192)
# zstd over the kernel's default, lzo-rle: about 30% less RAM for the same
# swapped pages, for 2 to 4 times the CPU.
compression-algorithm = zstd
