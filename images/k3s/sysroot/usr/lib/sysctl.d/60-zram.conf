# Reclaim tuning for swap on zram, the only swap
# (usr/lib/systemd/zram-generator.conf.d/50-k3s.conf).
# https://docs.kernel.org/admin-guide/sysctl/vm.html
#
# swappiness: the IO cost of swap relative to the filesystem, 0 to 200.
# The default, 60, assumes swap is slower. Swapping to zram is
# decompressing RAM, while file pages dropped instead are read back from
# the hosts' rotational or virtual disks: far cheaper. 180 makes swap 9
# times cheaper (180 / (200 - 180)), so cold anonymous memory goes to zram
# first and file pages (binaries, libraries, images) stay cached. Not 200:
# file pages would only be reclaimed once swap is full.
vm.swappiness = 180
# page-cluster: swap readahead, 2^n pages per fault. The default, 3,
# decompresses 8 pages on every fault: zram has no seek time to amortise,
# so the 7 neighbours only cost CPU and RAM. 0 reads the faulting page only.
vm.page-cluster = 0
