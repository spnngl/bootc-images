Port 42022
AddressFamily inet
UseDNS yes
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
# Key-only root login: hosts installed with `bootc install to-existing-root`
# get no blueprint, hence no other user. Passwords are refused anyway
# (PasswordAuthentication, AuthenticationMethods).
PermitRootLogin prohibit-password
MaxAuthTries 3
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
ClientAliveInterval 300
AllowAgentForwarding no
X11Forwarding no
IgnoreRhosts yes
AuthenticationMethods publickey
AllowTcpForwarding no
DisableForwarding yes
ForceCommand none
GatewayPorts no

# Yeah i know, all is mine.
AuthorizedKeysFile /usr/ssh/authorized_keys.d/keys
