# Short image names (no registry, e.g. coredns/coredns) resolve to
# docker.io only, for podman and CRI-O alike: Kubernetes manifests, like
# k3s' packaged ones, rely on it, as containerd does. With more than one
# search registry, short-name-mode "enforcing" (the default) rejects a
# short name as ambiguous when nothing can prompt, so CRI-O fails to pull.
# Other registries need full names (ghcr.io/..., quay.io/...).
# See containers-registries.conf(5).
unqualified-search-registries = ["docker.io"]
