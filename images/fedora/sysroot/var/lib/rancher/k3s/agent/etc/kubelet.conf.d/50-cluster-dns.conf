# Pods resolve through NodeLocal DNSCache, on every node, instead of the
# CoreDNS Service (10.43.0.10, k3s' default clusterDNS, written by k3s in
# 00-k3s-defaults.conf).
#
# See: https://kubernetes.io/docs/tasks/administer-cluster/nodelocaldns/
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
clusterDNS:
  - 169.254.25.10
