# One registry pull secret for bootc, podman and docker, also readable by
# the wheel group.
#
# bootc reads /etc/ostree/auth.json. It is machine-local and not in the image;
# config.example.toml shows how to add it to the disk image. Root's podman and
# docker both read ~/.docker/config.json, which uses the same format, so point
# it at the bootc file.
#
# /root is /var/roothome on bootc, and /var content from the image is only
# copied at first install, so create the link at every boot. `L` does not
# replace an existing file.
d /var/roothome/.docker 0700 root root -
# `podman login --authfile` rewrites the file as 0600 root:root. Restore the
# wheel read access at boot, or right away with:
#   sudo systemd-tmpfiles --create /usr/lib/tmpfiles.d/container-auth.conf
# Does nothing if the file does not exist.
z /etc/ostree/auth.json 0640 root wheel -
L /var/roothome/.docker/config.json - - - - /etc/ostree/auth.json
