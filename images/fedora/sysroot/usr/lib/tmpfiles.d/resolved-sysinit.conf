# Point /etc/resolv.conf at the systemd-resolved stub listener.
#
# AlmaLinux's systemd-resolved package ships no tmpfiles rule for it (Fedora's
# does, as `L!` in systemd-resolve.conf; this file sorts first and wins).
# `L+` replaces whatever is there: the image may carry a regular file left by
# the container build. See https://bootc.dev/bootc/building/dns.html
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
